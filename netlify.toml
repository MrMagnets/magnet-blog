[build]
  publish = "static"
  command = "echo '静态站点，无需构建'"

[[redirects]]
# 创建所有目录
mkdir -p .github/workflows
mkdir -p scripts
mkdir -p static
mkdir -p content/posts

# ========================================
# 创建 .github/workflows/daily-problems.yml
# ========================================
cat > .github/workflows/daily-problems.yml << 'EOF'
name: Fetch Daily Luogu Problems

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-problems:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run fetch script
        run: python scripts/fetch_problems.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/problems.json
          git diff --staged --quiet || git commit -m "chore: update daily problems [skip ci]"
          git push
