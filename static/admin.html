<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>发布文章 - 磁铁的博客</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container">
            <h1>🧲 磁铁的博客</h1>
            <nav>
                <a href="index.html">首页</a>
                <a href="admin.html" class="active">写文章</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="admin-section">
            <h2>✍️ 发布新文章</h2>
            <form id="publish-form">
                <div class="form-group">
                    <label for="post-title">标题</label>
                    <input type="text" id="post-title" placeholder="输入文章标题..." required />
                </div>
                <div class="form-group">
                    <label for="post-content-editor">内容 (Markdown)</label>
                    <textarea id="post-content-editor" rows="20" placeholder="使用 Markdown 格式书写..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="github-token">GitHub Token</label>
                    <input type="password" id="github-token" placeholder="输入你的 GitHub Personal Access Token..." required />
                    <small>需要在 GitHub Settings → Developer settings → Personal access tokens 中生成，勾选 repo 权限</small>
                </div>
                <button type="submit">🚀 发布文章</button>
            </form>
            <div id="publish-status"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 磁铁的博客</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
